<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Login - Owino Live</title>

<link
rel="stylesheet"
href="css/style.css">

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<script src="js/supabase.js"></script>

<script src="js/auth.js" defer></script>

</head>

<body>

<header>

<div class="logo">
Owino <span>Live</span>
</div>

<a
class="nav-btn"
href="index.html">

Home

</a>

</header>


<main>

<div class="form-card">

<h1>Login</h1>


<form
onsubmit="event.preventDefault(); loginUser();">


<div class="form-group">

<label>Email</label>

<input
id="email"
type="email"
required
autocomplete="email">

</div>


<div class="form-group">

<label>Password</label>

<input
id="password"
type="password"
required
autocomplete="current-password">

</div>


<button
class="btn btn-primary"
type="submit">

Login

</button>

</form>


<p
id="message"
class="message">
</p>


<p style="margin-top:20px;color:#aaa;">

Don't have an account?

<a
href="signup.html"
style="color:#ff3b81;">

Create one

</a>

</p>

</div>

</main>

</body>

</html>
