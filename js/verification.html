<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Creator Verification - Owino Live</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/common.js"></script>

<script src="js/verification.js" defer></script>

</head>

<body>

<header>

<div class="logo">
Owino <span>Live</span>
</div>

<a
class="nav-btn"
href="dashboard.html">

Dashboard

</a>

</header>


<main>

<div class="form-card">

<h1>Creator Verification</h1>


<div class="age-warning">

<strong>18+ Verification</strong>

<p>
Owino Live is an adults-only platform.
You must meet the applicable minimum age
requirement to apply for creator verification.
</p>

</div>


<form
id="verificationForm"
onsubmit="event.preventDefault(); submitVerification();">


<div class="form-group">

<label>Full Name</label>

<input
id="fullName"
type="text"
required>

</div>


<div class="form-group">

<label>Phone Number</label>

<input
id="phone"
type="tel"
required>

</div>


<div class="form-group">

<label>Reason for Applying</label>

<textarea
id="reason"
rows="5"
required
placeholder="Tell us why you want to become a creator">
</textarea>

</div>


<div class="form-group">

<label>Verification Document URL</label>

<input
id="documentUrl"
type="url"
placeholder="Secure document upload URL">

</div>


<div class="form-group">

<label>Selfie Verification URL</label>

<input
id="selfieUrl"
type="url"
placeholder="Secure selfie upload URL">

</div>


<button
class="btn btn-primary"
type="submit">

Submit Verification

</button>

</form>


<p
id="message"
class="message">
</p>

</div>

</main>

</body>
</html>
