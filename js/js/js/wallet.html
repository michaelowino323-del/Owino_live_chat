<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Wallet - Owino Live</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/common.js"></script>

<script src="js/wallet.js" defer></script>

</head>

<body>

<header>

<div class="logo">
Owino <span>Live</span>
</div>

<a
class="nav-btn"
href="dashboard.html">

Dashboard

</a>

</header>


<main class="container dashboard">

<h1>Creator Wallet</h1>

<br>


<div class="grid">


<div class="card stat">

<h3>Available Balance</h3>

<strong id="balance">
Loading...
</strong>

</div>


<div class="card stat">

<h3>Total Tips</h3>

<strong id="tips">
Loading...
</strong>

</div>


<div class="card stat">

<h3>Withdrawals</h3>

<strong id="withdrawals">
Loading...
</strong>

</div>


</div>


<section class="section">

<div class="card">

<h2>Withdraw Money</h2>

<br>

<p>
Eligible creators will be able to request
withdrawals after the payment system is connected.
</p>

<br>

<button
class="btn btn-secondary"
onclick="requestWithdrawal()">

Request Withdrawal

</button>


<p
id="message"
class="message">
</p>

</div>

</section>

</main>

</body>
</html>
