<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Live Room - Owino Live</title>

<link rel="stylesheet" href="css/style.css">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="js/supabase.js"></script>

<script src="js/common.js"></script>

<script src="js/live.js" defer></script>

</head>

<body>

<header>

<div class="logo">
Owino <span>Live</span>
</div>

<a
class="nav-btn"
href="dashboard.html">

Dashboard

</a>

</header>


<main class="container section">

<div class="grid">


<div>

<h1>Live Room</h1>

<br>

<div
class="live-box"
id="videoArea">

Checking live permission...

</div>

</div>


<div class="card chat">

<h2>Live Chat</h2>


<div
id="chatMessages"
class="chat-messages">
</div>


<div class="chat-input">

<input
id="chatInput"
type="text"
placeholder="Write a message...">

<button
onclick="sendChatMessage()">

Send

</button>

</div>

</div>


</div>

</main>

</body>
</html>
