<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Account - Owino Live</title>

<link
rel="stylesheet"
href="css/style.css">

<script
src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>

<script src="js/supabase.js"></script>

<script src="js/auth.js" defer></script>

</head>

<body>

<header>

<div class="logo">
Owino <span>Live</span>
</div>

<a
class="nav-btn"
href="index.html">

Home

</a>

</header>


<main>

<div class="form-card">

<h1>Create your account</h1>

<div class="age-warning">

<strong>18+ only</strong>

<p>
You must meet the applicable minimum
age requirement to use this platform.
</p>

</div>


<form
id="signupForm"
onsubmit="event.preventDefault(); signupUser();">


<div class="form-group">

<label>
Full name
</label>

<input
id="fullName"
type="text"
required
autocomplete="name">

</div>


<div class="form-group">

<label>
Email
</label>

<input
id="email"
type="email"
required
autocomplete="email">

</div>


<div class="form-group">

<label>
Password
</label>

<input
id="password"
type="password"
required
minlength="6"
autocomplete="new-password">

</div>


<button
class="btn btn-primary"
type="submit">

Create Account

</button>

</form>


<p
id="message"
class="message">
</p>


<p style="margin-top:20px;color:#aaa;">

Already have an account?

<a
href="login.html"
style="color:#ff3b81;">

Login

</a>

</p>

</div>

</main>

</body>

</html>
